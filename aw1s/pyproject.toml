[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aw1s"
version = "0.1.0"
description = "AW1S: entidad computacional -- prototipo aislado, sin wiring a AW1 v3 todavia."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "asyncpg>=0.29,<1.0",
    "pgvector>=0.3,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.scripts]
aw1s = "aw1s.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends(...) como valor por defecto a proposito (es el
# idiom oficial de inyeccion de dependencias) -- no es el problema que
# B008 detecta en general (una llamada mutable evaluada una sola vez al
# definir la funcion).
extend-immutable-calls = ["fastapi.Depends"]
