# AW1 junto a Ollama y Postgres.
#
#   docker compose up -d --build
#   docker compose exec ollama ollama pull mistral
#
# El puerto se publica solo en 127.0.0.1 a proposito: exponerlo a internet
# exige HTTPS por delante. AW1_API_TOKEN es opcional -el chat y el comparador
# de precios son de uso libre por diseno- y solo protege /api/memory si se
# define.
services:
  aw1:
    build: .
    image: aw1:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AW1_ENV: ${AW1_ENV:-development}
      # Por defecto usa el contenedor `ollama` de este mismo compose. Para
      # apuntar a un Ollama externo (ej. un tunel hacia otra maquina), define
      # AW1_OLLAMA_HOST (y AW1_OLLAMA_TUNNEL_KEY si el tunel lo exige) en .env.
      AW1_OLLAMA_HOST: ${AW1_OLLAMA_HOST:-http://ollama:11434}
      AW1_OLLAMA_TUNNEL_KEY: ${AW1_OLLAMA_TUNNEL_KEY:-}
      AW1_OLLAMA_MODEL: ${AW1_OLLAMA_MODEL:-mistral}
      AW1_OLLAMA_FAST_MODEL: ${AW1_OLLAMA_FAST_MODEL:-}
      AW1_LLM_PROVIDER: ${AW1_LLM_PROVIDER:-ollama}
      AW1_GROQ_API_KEY: ${AW1_GROQ_API_KEY:-}
      AW1_API_TOKEN: ${AW1_API_TOKEN:-}
      AW1_ADMIN_PASSWORD: ${AW1_ADMIN_PASSWORD:-}
      AW1_OPENAI_API_KEY: ${AW1_OPENAI_API_KEY:-}
      AW1_ALLOWED_ORIGINS: ${AW1_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      AW1_BROWSER_MAX_CONTEXTS: ${AW1_BROWSER_MAX_CONTEXTS:-3}
      AW1_BROWSER_PROXY_URL: ${AW1_BROWSER_PROXY_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aw1:aw1@postgres:5432/aw1}
    volumes:
      - aw1-data:/data
    # Chromium necesita mas memoria compartida que la que da Docker por defecto.
    shm_size: "1gb"
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Para GPU NVIDIA, descomenta:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aw1
      POSTGRES_PASSWORD: aw1
      POSTGRES_DB: aw1
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Solo la red interna de docker compose: nunca expuesto a internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aw1 -d aw1"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  aw1-data:
  ollama-models:
  postgres-data:
