[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aw1"
version = "3.0.0"
description = "AW1: asistente local con Ollama y comparador de precios que navega tiendas reales."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "sse-starlette>=2.1",
    "playwright>=1.45",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aw1 = "aw1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aw1 = ["db/*.sql", "browser/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/aw1/api/routes/*" = ["B008"]
"src/aw1/llm/*" = ["ASYNC109"]
"src/aw1/core/http.py" = ["ASYNC109"]
# Servir el SPA hace un par de llamadas de Path (resolve/is_file) sobre disco
# local, no red: el costo de bloquear el loop es despreciable y no amerita
# anyio.Path solo para esto.
"src/aw1/api/app.py" = ["ASYNC240"]
"tests/*" = ["S", "B011", "E501", "SIM117", "ASYNC109"]

[tool.mypy]
python_version = "3.11"
packages = ["aw1"]
mypy_path = "src"
ignore_missing_imports = true
