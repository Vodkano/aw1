image:
  file: .gitpod.Dockerfile

tasks:
  - name: Instalar y arrancar Ollama
    init: |
      curl -fsSL https://ollama.com/install.sh | sh
      ollama serve > /tmp/ollama.log 2>&1 &
      sleep 5
      ollama pull llama3.2:3b
    command: ollama serve

  - name: Instalar AW1
    init: |
      make install
      if [ ! -f .env ]; then
        cp .env.example .env
        echo "AW1_ALLOW_PRIVATE_HOSTS=true" >> .env
        echo "AW1_OLLAMA_FAST_MODEL=llama3.2:3b" >> .env
      fi
    command: |
      gp await-port 11434 --timeout 60s || true
      make run

ports:
  - port: 8000
    onOpen: open-preview
    visibility: public
  - port: 5173
    onOpen: ignore
  - port: 11434
    onOpen: ignore
    visibility: private

vscode:
  extensions:
    - ms-python.python
    - dbaeumer.vscode-eslint
    - esbenp.prettier-vscode
