name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ruff
        run: python -m ruff check --output-format=github .

      - name: Mypy
        run: python -m mypy

      - name: Pruebas
        run: python -m pytest --cov=aw1 --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que no hay secretos en el repositorio
        run: |
          if grep -rInE "(sk-[A-Za-z0-9]{20,}|AW1_OPENAI_API_KEY=.+|AW1_API_TOKEN=.{8,})" \
             --exclude-dir=.git --exclude-dir=node_modules --exclude=.env.example \
             --exclude=ci.yml .; then
            echo "::error::Se detecto un posible secreto en el repositorio"
            exit 1
          fi

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aw1:ci .
